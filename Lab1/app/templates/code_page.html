{% extends "base.html" %}
{% load static %}

{% block content %}
    <main class="container code-page">

        <div class="row">
            <div class="col-6">
                <img src="{{ code.image }}" class="code-image" alt="" style="width:100%;"/>
            </div>
            <div class="col-6 d-flex flex-md-column gap-md-3">

                <h1 style="color: #1071BC">{{ code.name }}</h1>

                <span style="word-break: break-word">Бинарный код: {{ code.description }}</span>

                <span>Объем: {{ code.weight }}байт</span>

                <a href="/" class="btn btn-primary my-4 w-25 return-btn">
                    Домой
                </a>

            </div>
        </div>

    </main>
{% endblock content %}
